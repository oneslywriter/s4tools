<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>s4tools</title>
  <meta name="description" content="s4tools: play the Torso S-4 from your computer, teach it your MIDI controller, record it, and build projects for it from your own samples.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 18 18%22%3E%3Crect x=%221%22 y=%221%22 width=%227%22 height=%227%22 rx=%222%22 fill=%22%23e4572e%22/%3E%3Crect x=%2210%22 y=%221%22 width=%227%22 height=%227%22 rx=%223.5%22 fill=%22%23c98a12%22/%3E%3Crect x=%221%22 y=%2210%22 width=%227%22 height=%227%22 rx=%223.5%22 fill=%22%2316907c%22/%3E%3Crect x=%2210%22 y=%2210%22 width=%227%22 height=%227%22 rx=%222%22 fill=%22%236a58c9%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // the theme before anything is drawn (Settings > Theme; "system" follows the OS: Paper or Night)
    (function () {
      let t = 'system';
      try { t = JSON.parse(localStorage.getItem('s4tools.theme') || '"system"'); } catch (e) { /* the default */ }
      document.documentElement.dataset.theme = t === 'system' || !t ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="hdr"></header>
    <div id="subbar" hidden></div>
    <div id="listenBar" hidden></div>
    <main>
      <section id="view-live" class="view"></section>
      <section id="view-build" class="view" hidden></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="js/util.js"></script>
  <script src="js/ccmap.js"></script>

  <script src="js/listen.js"></script>
  <script src="js/live.js"></script>
  <script src="js/idb.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/warp.js"></script>
  <script src="js/hwpreview.js"></script>
  <script src="js/s4project.js"></script>
  <script src="js/mods.js"></script>
  <script src="js/follow.js"></script>
  <script src="js/s4drive.js"></script>
  <script src="js/build.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
